name: Deploy to IIS

on:
  push:
    branches:
      - develop

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 7.0.x

      - name: Restore
        run: dotnet restore .\src\Presentation\Nop.Web\Nop.Web.csproj

      - name: Build
        run: dotnet build .\src\Presentation\Nop.Web\Nop.Web.csproj -c Release --no-restore

      - name: Publish
        run: dotnet publish .\src\Presentation\Nop.Web\Nop.Web.csproj -c Release -o publish

      - name: Deploy to IIS
        shell: powershell
        run: |
            & "C:\Program Files\IIS\Microsoft Web Deploy V3\msdeploy.exe" `
            -verb:sync `
            -source:contentPath="${{ github.workspace }}\publish" `
            -dest:iisApp="${{ secrets.IIS_SITE_NAME }}",computerName="https://${{ secrets.IIS_SERVER }}:8172/msdeploy.axd",userName="${{ secrets.DEPLOYER_USERNAME }}",password="${{ secrets.DEPLOYER_PASSWORD }}",authType="Basic",allowUntrusted="true"